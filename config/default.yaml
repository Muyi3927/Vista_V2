# =============================================================================
# VISTA: 图像矢量化主配置文件
# 运行方式：
#   cd src && python vista_main.py
# =============================================================================

project:
  # 项目根目录（留空则自动根据代码位置探测项目根目录）
  root: ""
  # Web 交互临时文件输出目录
  temp_outputs: temp_outputs

# 运行模式：
#   auto   - 自动判定：paths.input 为单张图片文件则单图运行；为目录则批量运行
#   image  - 强制按单图模式运行
#   folder - 强制按文件夹批量模式运行
run:
  mode: auto

paths:
  # 输入图像文件或包含图像的目录路径
  input: /home/jh/research/projects/VISTA/dataset/pairs_50
  # 矢量化结果（SVG/GIF/JSON）输出根目录
  output: outputs/pairs_50_1
  # SAM 语义分割模型权重路径
  sam_checkpoint: checkpoints/sam_vit_h_4b8939.pth

# 计算设备：auto (优先GPU) | cuda:0 | cpu
device: auto

# -----------------------------------------------------------------------------
# 候选分割生成（SAM + SLIC）
# -----------------------------------------------------------------------------
sam:
  enabled: true
  model_type: vit_h
  pred_iou_thresh: 0.88
  stability_score_thresh: 0.95
  crop_n_layers: 1
  points_per_side: 64
  min_mask_region_area: 0

slic:
  enabled: true
  # 单个超像素期望物理边长（像素），>0 时自动根据图像分辨率计算超像素数：
  # n_segments = clip((H*W)/(cell_size^2), min_segments, max_segments)
  cell_size: 14.0
  min_segments: 800
  max_segments: 8000
  # 固定超像素数（仅当 cell_size <= 0 时生效）
  n_segments: 2000
  # 紧凑度（推荐 15.0，使超像素形状规整，避免细长多边形锯齿）
  compactness: 15.0
  # CIELAB 色彩空间下的 DBSCAN 聚类阈值
  dbscan_eps: 6.0
  # 是否在 CIELAB 感知均匀空间下计算色差
  use_lab: true
  # 是否强制超像素空间连通性
  enforce_connectivity: true

# -----------------------------------------------------------------------------
# 掩码预处理与分层融合（孔洞提取、连通域拆分、纯度感知直接父级同色吸收）
# -----------------------------------------------------------------------------
preprocess:
  # 图像预处理尺寸（0 表示保持原始分辨率，>0 表示缩放到指定最长边）
  target_size: 0
  # 是否开启轻量保边去噪滤波 (Bilateral Filter)，抑制 JPEG 噪点块
  denoise: true
  # 双边滤波色彩方差与空间方差
  denoise_sigma_color: 35.0
  denoise_sigma_space: 35.0
  # 透明图 (RGBA) 合成底色 [R, G, B]（null 表示自适应前景亮度自动选取反差色底）
  composite_bg_color: null
  # 是否将 RGBA 提取的原生 Alpha 前景轮廓作为高优先级候选图层
  use_alpha_mask: true
  # 导出最终 SVG 时是否去除全屏底色矩形 (null/auto: 自动跟随输入图像是否有透明背景；true: 强制透明；false: 强制保留实心背景)
  transparent_svg: null
  # 最小有效掩码面积比例（若 >= 1 则为绝对像素数）
  min_area: 0.00015
  # SAM 压制重叠 SLIC 候选的 IoU 阈值（推荐 0.85）
  iou_sam_slic_thresh: 0.85
  # SAM 内部自去重的 IoU 阈值
  iou_threshold: 0.90
  # SAM 纯色压制保护阈值（低于此方差的 SAM 才能压制 SLIC，高于此方差说明是复合容器不予压制）
  sam_pure_suppress_std: 10.0
  # SLIC 单向被 SAM 包含率压制阈值（SLIC > 85% 都在同色 SAM 内部时自动剔除）
  slic_contain_suppress_thresh: 0.85
  # 判定直接父级包含关系的面积包含率阈值
  inclusion_threshold: 0.90
  # 自身颜色方差保护阈值（高于此方差判定为不纯/纹理大块，跳过被吸收）
  self_pure_std_thresh: 15.0
  # 直接父级颜色方差保护阈值（高于此方差判定父级包含多物体，停止吸收）
  parent_pure_std_thresh: 3.0
  # 父子图层同色吸收的最大颜色欧氏距离阈值
  color_diff_thresh: 5.0

# -----------------------------------------------------------------------------
# 贝塞尔曲线几何拟合
# -----------------------------------------------------------------------------
path_fit:
  # 贝塞尔拟合误差容差（< 0.1 则为相对长边比例，默认 0.003 对应 512 分辨率下的 1.5px）
  bezier_max_error: 0.003
  # 直线判断阈值（< 0.1 则为相对长边比例，默认 0.004 对应 512 分辨率下的 2.0px）
  line_threshold: 0.004
  # approxPolyDP 简化精度（null 则自适应跟随 bezier_max_error）
  poly_epsilon: null
  # 轮廓点最小间距（< 0.1 则为相对长边比例，默认 0.004 对应 512 分辨率下的 2.0px）
  contour_min_dist: 0.004

# -----------------------------------------------------------------------------
# DiffVG 可微渲染优化超参数
# -----------------------------------------------------------------------------
optimize:
  # 控制点坐标学习率
  learning_rate: 0.1
  # 填充颜色学习率
  color_lr: 0.01
  # 描边宽度学习率
  stroke_width_lr: 0.05
  # 描边颜色学习率
  stroke_color_lr: 0.01
  # 最大优化迭代步数
  num_iters: 1000
  # 是否开启描边优化
  is_stroke: false
  # 早停容忍步数
  early_stopping_patience: 20
  # 早停最小改善阈值
  early_stopping_delta: 5.0e-5
  # 共线平滑正则化损失权重
  collinear_scale: 0.01
  # 共线夹角余弦判定阈值
  collinear_cos_threshold: 0.5
  # 中间 SVG 保存间隔步数
  save_every: 5
  # 动画帧采样间隔步数
  frame_every: 5

# -----------------------------------------------------------------------------
# 优化后几何光栅化剪枝与短迭代精修
# -----------------------------------------------------------------------------
prune:
  enabled: true
  # 剪枝颜色差异阈值（基于 CIELAB 感知色彩距离 Delta E 自动缩放，0.04 对应 Delta E 约为 8.0）
  rm_color_threshold: 0.04
  # 剪枝几何包含率阈值
  inclusion_threshold: 0.75
  # 剪枝后二次微调迭代步数
  refine_iters: 100
  # 几何光栅化二值化阈值
  raster_threshold: 0.5

# -----------------------------------------------------------------------------
# 中间过程输出与可视化结果保存开关（默认全部开启）
# -----------------------------------------------------------------------------
save_options:
  # 是否保存阶段1原始分割掩码 (raw_sam_masks / raw_slic_masks)
  save_raw_masks: true
  # 是否保存阶段2形态学拆解后的原版掩码 (origin_masks)
  save_origin_masks: true
  # 是否保存阶段3 IoU去重后的中间掩码 (nms_masks)
  save_nms_masks: true
  # 是否保存阶段3最终精炼掩码 (pre_masks)
  save_pre_masks: true
  # 是否同步保存单图层真彩掩码 png
  save_color_mask: true
  # 是否生成各阶段全景彩色叠加图 (overview_colored.png)
  save_overview_images: true
  # 是否在 init_svgs 中保存单图层及累积的每一步 SVG 文件
  save_step_svgs: true
